services:
  - type: web
    name: wa-job-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: WA_PHONE
        value: "918651052069"
      - key: NODE_VERSION
        value: "22"
